name: Mirror from new-eve.org

on:
  schedule:
    - cron: '0 * * * *' # Sync hourly
  workflow_dispatch:

jobs:
  sync-mirror:
    name: Sync mirror from new-eve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branches from new-eve.org
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add canonical https://git.new-eve.org/redforged/extrovert.git
          git fetch canonical master
          git checkout master
          git reset --hard canonical/master
          git push origin master --tags --force
