name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests — feed algorithm + sanitization
        run: npm test

      - name: REST API integration suite
        run: npm run test:api

      - name: OWASP Top 10 (2021) security suite
        run: npm run test:owasp

      - name: OWASP ASVS v4.0 verification suite
        run: npm run test:asvs

      - name: OAuth 2.0 / OIDC flow suite
        run: npm run test:oauth

      - name: Multi-account suite
        run: npm run test:multi-account

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t extrovert:ci .
